<!DOCTYPE html>
<html lang="pt-BR">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Cadastro de Profissional da Saúde
  </title>
  <link href="../css/styles.css" rel="stylesheet"/>
 </head>
 <body>
  <div class="pagina">
   <a class="voltar" href="../index.html">
    ← Voltar ao menu
   </a>
   <h1>
    Cadastro de Profissional da Saúde
   </h1>
   <form>
    <label>
     Nome
     <input placeholder="" type="text"/>
    </label>
    <label>
     Registro profissional
     <input placeholder="" type="text"/>
    </label>
    <label>
     Especialidade
     <input placeholder="" type="text"/>
    </label>
    <label>
     Telefone
     <input placeholder="" type="tel"/>
    </label>
    <label>
     E-mail
     <input placeholder="" type="email"/>
    </label>
    <button type="button">
     Salvar
    </button>
    <button class="cancelar" type="button">
     Cancelar
    </button>
   </form>
  </div>
 </body>
</html>
